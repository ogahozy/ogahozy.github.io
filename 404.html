<!DOCTYPE html>
<script>
  var path = window.location.pathname;
  var slug = path.match(/\/demo\/([^\/]+)/);
  if (slug) {
    try { sessionStorage.setItem('demoSlug', decodeURIComponent(slug[1])); } catch(e){}
    window.location.replace('/demo.html');
  } else {
    window.location.replace('/');
  }
</script>
