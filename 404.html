<!DOCTYPE html>
<script>
  var path = window.location.pathname;
  var slug = path.match(/\/demo\/([^\/]+)/);
  if (slug) {
    try { sessionStorage.setItem('demoSlug', decodeURIComponent(slug[1])); } catch(e){}
    // Preserve any query params (e.g. ?msgs=55) when redirecting
    window.location.replace('/demo.html' + window.location.search);
  } else {
    window.location.replace('/');
  }
</script>
